<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CF Browser</title>
<style>
  :root {
    --bg: #0d0d14;
    --bg2: #14141f;
    --bg3: #1c1c2e;
    --surface: #1a1a2e;
    --surface2: #23233a;
    --border: #2a2a42;
    --border2: #3a3a5e;
    --text: #e8e8f0;
    --text2: #a0a0b8;
    --text3: #6a6a88;
    --accent: #7c5cff;
    --accent2: #9d85ff;
    --accent-glow: rgba(124, 92, 255, 0.35);
    --danger: #e2685f;
    --success: #56d18a;
    --warn: #f0b429;
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
    font-size: 13px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== TITLEBAR ===== */
  .titlebar {
    height: 38px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--border);
    user-select: none; -webkit-app-region: drag;
  }
  .titlebar .title { font-size: 13px; font-weight: 600; color: var(--text2); letter-spacing: 0.3px; }
  .titlebar .controls { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .titlebar button {
    width: 28px; height: 28px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .titlebar button:hover { background: var(--surface2); color: var(--text); }

  /* ===== TAB BAR ===== */
  .tabbar {
    height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px;
    background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 30px;
    border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
    background: transparent; color: var(--text3); font-size: 12px;
    transition: background var(--transition), color var(--transition);
    position: relative; max-width: 200px;
  }
  .tab:hover { background: var(--surface); color: var(--text2); }
  .tab.active {
    background: var(--surface); color: var(--text); font-weight: 500;
  }
  .tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 8px; right: 8px; height: 2px;
    background: var(--accent); border-radius: 1px;
  }
  .tab .close { opacity: 0; margin-left: 4px; font-size: 14px; line-height: 1; }
  .tab:hover .close, .tab.active .close { opacity: 1; }
  .tab .close:hover { color: var(--danger); }
  .newtab-btn {
    width: 28px; height: 28px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text3); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .newtab-btn:hover { background: var(--surface); color: var(--text); }

  /* ===== TOOLBAR / ADDRESS BAR ===== */
  .toolbar {
    height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
  }
  .nav-btn {
    width: 30px; height: 30px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .nav-btn:hover { background: var(--surface); color: var(--text); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .addrbar {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border2); border-radius: 20px;
    padding: 0 14px; height: 32px; transition: border-color var(--transition), box-shadow var(--transition);
  }
  .addrbar:focus-within {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .addr-input {
    flex: 1; border: none; background: transparent; color: var(--text);
    font-size: 13px; outline: none; font-family: inherit;
  }
  .addr-input::placeholder { color: var(--text3); }
  .go-btn {
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), transform var(--transition);
  }
  .go-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .star-btn, .settings-btn {
    width: 30px; height: 30px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .zoom-btn, .home-btn, .source-close {
    width: 30px; height: 30px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .zoom-btn:hover, .home-btn:hover, .source-close:hover {
    background: var(--surface); color: var(--text);
  }

  /* ===== BOOKMARKS BAR ===== */
  .bookmarks-bar {
    height: 30px; display: flex; align-items: center; gap: 2px; padding: 0 8px;
    background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto;
    scrollbar-width: none;
  }
  .bookmarks-bar::-webkit-scrollbar { display: none; }
  .bookmark-item {
    display: flex; align-items: center; gap: 4px; padding: 2px 8px; height: 22px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; color: var(--text2);
    white-space: nowrap; transition: background var(--transition);
  }
  .bookmark-item:hover { background: var(--surface); color: var(--text); }
  .bm-remove { opacity: 0; margin-left: 2px; font-size: 12px; }
  .bookmark-item:hover .bm-remove { opacity: 1; color: var(--danger); }

  /* ===== CONTENT AREA ===== */
  .content {
    position: relative; background: var(--bg); overflow: hidden;
    height: calc(100vh - 148px);
  }
  .tabview { position: absolute; inset: 0; }
  .tabview[hidden] { display: none; }
  .webview {
    width: 100%; height: 100%; border: none; background: #fff;
  }

  /* ===== LOADING / ERROR ===== */
  .loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: var(--bg); color: var(--text2);
    font-size: 13px; gap: 14px;
  }
  .loading .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-page {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: var(--bg); color: var(--text2);
    text-align: center; padding: 24px; gap: 8px;
  }
  .error-page h2 { color: var(--danger); font-size: 16px; margin: 0; }
  .error-page .url { color: var(--text3); font-size: 12px; word-break: break-all; max-width: 500px; }

  /* ===== NEW TAB ===== */
  .newtab {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; background: var(--bg);
  }
  .newtab h1 { font-size: 36px; font-weight: 700; color: var(--accent); margin: 0; letter-spacing: 1px; }
  .newtab p { color: var(--text3); font-size: 13px; margin: 0; }
  .newtab .shortcuts {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px;
    max-width: 480px; width: 100%; padding: 0 24px;
  }
  .newtab .shortcut {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 18px 12px; border-radius: var(--radius-lg); cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    transition: background var(--transition), border-color var(--transition), transform var(--transition);
  }
  .newtab .shortcut:hover {
    background: var(--surface2); border-color: var(--accent);
    transform: translateY(-2px);
  }
  .newtab .shortcut .icon { font-size: 28px; }
  .newtab .shortcut .label { font-size: 11px; color: var(--text2); font-weight: 500; }

  /* ===== PROXY HINT BAR ===== */
  .proxy-hint {
    position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 45;
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 10px 14px; box-shadow: var(--shadow);
    font-size: 12px; color: var(--text2); max-width: min(680px, 92vw);
    backdrop-filter: blur(8px);
  }
  .proxy-hint button {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 5px 12px; font-size: 11px; cursor: pointer; white-space: nowrap; font-weight: 500;
    transition: background var(--transition);
  }
  .proxy-hint button:hover { background: var(--accent2); }
  .proxy-hint button.ghost { background: transparent; color: var(--text3); border: 1px solid var(--border2); }
  .proxy-hint button.ghost:hover { background: var(--surface2); color: var(--text2); }

  /* ===== INTERNAL cfb:: PAGES ===== */
  .cfb-page {
    height: 100%; overflow: auto; background: var(--bg); color: var(--text);
    padding: 28px 32px; font-size: 13px; box-sizing: border-box;
  }
  .cfb-page h1 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .cfb-page h3 { font-weight: 600; }
  .cfb-page .empty { color: var(--text3); }
  .cfb-page .item {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 12px 4px; border-bottom: 1px solid var(--border);
    transition: background var(--transition);
  }
  .cfb-page .item:hover { background: var(--surface); }
  .cfb-page .item .title { color: var(--text); font-weight: 500; }
  .cfb-page .item .url { color: var(--text3); font-size: 11px; word-break: break-all; }
  .cfb-page .item button {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 5px 12px; font-size: 11px; cursor: pointer; flex: 0 0 auto; font-weight: 500;
    transition: background var(--transition);
  }
  .cfb-page .item button:hover { background: var(--accent2); }
  .cfb-page .about {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 4px; text-align: center;
  }
  .cfb-page .about .logo { font-size: 54px; margin-bottom: 8px; }
  .cfb-page .about h1 { margin: 0; }
  .cfb-page .about p { color: var(--text2); }

  /* ===== WORDLE ===== */
  .wd { display: flex; flex-direction: column; align-items: center; gap: 13px; user-select: none; padding-top: 4px; }
  .wd h1 { margin: 0; letter-spacing: 3px; text-transform: uppercase; font-size: 17px; color: var(--text); }
  .wd-sub { color: var(--text3); font-size: 11px; margin-top: -8px; }
  .wd-grid { display: grid; gap: 6px; }
  .wd-row { display: grid; grid-template-columns: repeat(5, 54px); gap: 6px; }
  .wd-tile {
    height: 54px; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border2); background: var(--bg3); color: var(--text);
    font-size: 25px; font-weight: 700; text-transform: uppercase; border-radius: var(--radius-sm);
    transition: border-color var(--transition);
  }
  .wd-tile.filled { border-color: var(--text3); }
  .wd-tile.correct { background: #3a9b5c; border-color: #3a9b5c; }
  .wd-tile.present { background: #b39321; border-color: #b39321; }
  .wd-tile.absent { background: var(--surface2); border-color: var(--surface2); color: var(--text3); }
  .wd-tile.flip { animation: wdflip .36s ease; }
  @keyframes wdflip { 0% { transform: rotateX(0deg); } 50% { transform: rotateX(88deg); } 100% { transform: rotateX(0deg); } }
  .wd-row.shake { animation: wdshake .4s; }
  @keyframes wdshake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .wd-msg { height: 16px; font-size: 12px; color: var(--text2); text-align: center; }
  .wd-msg.good { color: var(--success); }
  .wd-msg.bad { color: var(--danger); }
  .wd-kb { display: flex; flex-direction: column; gap: 6px; }
  .wd-kbrow { display: flex; gap: 5px; justify-content: center; }
  .wd-key {
    min-width: 31px; height: 38px; padding: 0 7px; border-radius: var(--radius-sm); border: none;
    background: var(--surface2); color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer; text-transform: uppercase; font-family: inherit;
    transition: background var(--transition);
  }
  .wd-key:hover { background: var(--border2); }
  .wd-key.wide { min-width: 52px; font-size: 10px; letter-spacing: .5px; }
  .wd-key.correct { background: #3a9b5c; }
  .wd-key.present { background: #b39321; }
  .wd-key.absent { background: var(--bg3); color: var(--text3); }
  .wd-foot { display: flex; gap: 8px; align-items: center; }
  .wd-foot button, .wd-foot select {
    background: transparent; border: 1px solid var(--border2); color: var(--text2);
    border-radius: var(--radius-sm); padding: 6px 12px; font-size: 11px; cursor: pointer;
    font-family: inherit; transition: border-color var(--transition), color var(--transition);
  }
  .wd-foot button:hover { border-color: var(--accent); color: var(--text); }
  .wd-foot select { background: var(--surface); }
  .wd-stats { font-size: 11px; color: var(--text3); }

  /* ===== MULTIPLAYER BAR ===== */
  .mp-bar {
    height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: var(--bg2); border-top: 1px solid var(--border); font-size: 12px;
  }
  .mp-status { color: var(--text2); font-weight: 500; }
  .mp-peers { display: flex; gap: 4px; }
  .mp-peer {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center;
    justify-content: center;
  }
  .mp-btn {
    background: var(--surface); color: var(--text2); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: 11px; cursor: pointer;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .mp-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }

  /* ===== MULTIPLAYER CHAT ===== */
  .mp-chat {
    position: fixed; bottom: 50px; right: 12px; width: 300px; max-height: 400px;
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg);
    display: none; flex-direction: column; z-index: 50; box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
  }
  .mp-chat.open { display: flex; }
  .mp-chat-header {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 12px; color: var(--text); cursor: move; user-select: none;
  }
  .mp-chat-header .close { cursor: pointer; color: var(--text3); font-size: 16px; }
  .mp-chat-header .close:hover { color: var(--danger); }
  .mp-chat-messages {
    flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; min-height: 120px;
    max-height: 260px;
  }
  .mp-chat-messages::-webkit-scrollbar { width: 4px; }
  .mp-chat-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .mp-chat-msg { margin-bottom: 6px; line-height: 1.4; }
  .mp-chat-msg .name { font-weight: 600; color: var(--accent2); }
  .mp-chat-msg .ts { color: var(--text3); font-size: 10px; margin-right: 4px; }
  .mp-chat-msg.sys { color: var(--text3); font-style: italic; font-size: 11px; }
  .mp-chat-msg.me .name { color: var(--success); }
  .mp-chat-input {
    display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border);
  }
  .mp-chat-input input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); padding: 6px 10px; font-size: 12px; outline: none;
    transition: border-color var(--transition);
  }
  .mp-chat-input input:focus { border-color: var(--accent); }
  .mp-chat-input button {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 6px 12px; font-size: 11px; cursor: pointer; font-weight: 500;
    transition: background var(--transition);
  }
  .mp-chat-input button:hover { background: var(--accent2); }
  .mp-chat-who { color: var(--text3); font-size: 10px; cursor: pointer; }
  .mp-chat-who:hover { color: var(--accent); }
  .mp-chat-badge {
    background: var(--danger); color: #fff; font-size: 9px; font-weight: 700;
    padding: 1px 5px; border-radius: 8px; margin-left: 4px;
  }

  /* ===== LIVE CURSORS ===== */
  .mp-cursor-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .mp-cursor { position: absolute; opacity: 0; transition: opacity .25s ease; will-change: left, top; }
  .mp-cursor.live { opacity: 1; }
  .mp-cursor svg { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.55)); }
  .mp-cursor-label {
    position: absolute; left: 13px; top: 17px; font-size: 10px; font-weight: 700;
    color: #0b0b12; padding: 1px 6px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .mp-click-ring {
    position: absolute; transform: translate(-50%, -50%); width: 14px; height: 14px;
    border-radius: 50%; border: 2px solid #ffd700; box-shadow: 0 0 10px rgba(255,215,0,.7);
    animation: mpClickRipple .65s ease-out forwards;
  }
  @keyframes mpClickRipple {
    0% { transform: translate(-50%,-50%) scale(0.6); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(3.2); opacity: 0; }
  }

  /* ===== SCREEN SHARE VIEW ===== */
  #mpShareView video { background: #000; }

  /* ===== MULTIPLAYER OVERLAY ===== */
  .mp-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .mp-panel {
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg);
    padding: 24px; width: 360px; max-width: 90vw; text-align: center;
    box-shadow: var(--shadow);
  }
  .mp-panel-wide { width: 420px; }
  .mp-panel h2 { color: var(--accent); margin-bottom: 12px; font-size: 18px; }
  .mp-panel p { color: var(--text2); font-size: 12px; margin-bottom: 12px; }
  .mp-panel input {
    width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text); font-size: 13px; margin-bottom: 12px; outline: none;
    transition: border-color var(--transition);
  }
  .mp-panel input:focus { border-color: var(--accent); }
  .mp-panel button {
    padding: 8px 16px; border-radius: var(--radius-sm); border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; margin: 4px; font-weight: 500;
    transition: background var(--transition);
  }
  .mp-panel button:hover { background: var(--accent2); }
  .mp-panel button.secondary { background: var(--surface2); color: var(--text2); }
  .mp-panel button.secondary:hover { background: var(--border2); color: var(--text); }
  .mp-panel .code-display {
    font-size: 24px; font-weight: 800; color: var(--warn); letter-spacing: 4px; margin: 12px 0;
  }
  .mp-fields { display: flex; gap: 12px; margin-bottom: 8px; }
  .mp-fields label { flex: 1; text-align: left; font-size: 11px; color: var(--text3); }
  .mp-fields input { margin-bottom: 0; }
  .mp-toggles { display: flex; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
  .mp-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); cursor: pointer; }
  .mp-check input { width: auto; margin: 0; }
  .mp-hint { color: var(--text3); font-size: 11px; margin-top: 8px; }
  .mp-err { color: var(--danger); font-size: 12px; margin-bottom: 12px; }
  .mp-panel select {
    width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text); font-size: 13px; margin-bottom: 12px; outline: none;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* ===== FIND BAR ===== */
  .find-bar {
    position: fixed; top: 80px; right: 12px; z-index: 40;
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 6px 8px; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
  }
  .find-bar input {
    width: 180px; height: 26px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text); padding: 0 10px; font-size: 12px; outline: none;
  }
  .find-bar input:focus { border-color: var(--accent); }
  .find-bar button {
    padding: 4px 8px; border-radius: var(--radius-sm); border: none;
    background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 11px;
    transition: background var(--transition);
  }
  .find-bar button:hover { background: var(--border2); color: var(--text); }
  .find-count { font-size: 11px; color: var(--text3); min-width: 40px; text-align: center; }
  .zoom-controls { display: flex; align-items: center; gap: 4px; }
  .zoom-level { font-size: 11px; color: var(--text3); min-width: 36px; text-align: center; }

  /* ===== THEMES ===== */
  body.theme-light { background: #f0f0f5; color: #1a1a2e; }
  body.theme-light .titlebar, body.theme-light .tabbar, body.theme-light .mp-bar, body.theme-light .statusbar, body.theme-light .bookmarks-bar { background: #e8e8f0; color: #1a1a2e; border-color: #d0d0e0; }
  body.theme-light .content { background: #fff; }

  body.theme-light .tab.active { background: #fff; }
  body.theme-light .addr-bar, body.theme-light .mp-chat { background: #fff; border-color: #d0d0e0; }
  body.theme-light .addr-input { color: #1a1a2e; }
  body.theme-light .newtab h1 { color: var(--accent); }
  body.theme-light .cfb-page { background: #f5f5fa; color: #1a1a2e; }
  body.theme-light .cfb-page .item .title { color: #1a1a2e; }
  body.theme-light .cfb-page .item .url { color: #666; }
  body.theme-light .wd-tile { background: #e8e8f0; border-color: #ccc; color: #1a1a2e; }

  body.theme-light .mp-chat-messages { color: #1a1a2e; }

  body.theme-midnight { --accent: #00d4ff; --accent2: #33ddff; --accent-glow: rgba(0,212,255,0.35); }
  body.theme-midnight .go-btn, body.theme-midnight .mp-btn, body.theme-midnight .cfb-page .item button { background: #00d4ff; color: #000; }
  body.theme-midnight .tab.active::after { background: #00d4ff; }
  body.theme-midnight .newtab h1, body.theme-midnight .cfb-page h1 { color: #00d4ff; }
  body.theme-midnight .wd-tile.correct, body.theme-midnight .wd-key.correct { background: #00d4ff; color: #000; }
  body.theme-forest { --accent: #4ade80; --accent2: #6ee7a0; --accent-glow: rgba(74,222,128,0.35); }
  body.theme-forest .go-btn, body.theme-forest .mp-btn, body.theme-forest .cfb-page .item button { background: #4ade80; color: #000; }
  body.theme-forest .tab.active::after { background: #4ade80; }
  body.theme-forest .newtab h1, body.theme-forest .cfb-page h1 { color: #4ade80; }
  body.theme-forest .wd-tile.correct, body.theme-forest .wd-key.correct { background: #4ade80; color: #000; }

  body.theme-sunset .go-btn, body.theme-sunset .mp-btn, body.theme-sunset .cfb-page .item button { background: #fb923c; color: #000; }
  body.theme-sunset .tab.active::after { background: #fb923c; }
  body.theme-sunset .newtab h1, body.theme-sunset .cfb-page h1 { color: #fb923c; }
  body.theme-sunset .wd-tile.correct, body.theme-sunset .wd-key.correct { background: #fb923c; color: #000; }
</style>
</head>
<body>

<div class="titlebar">CF Browser — Powered by Cloudflare Pages</div>

<div class="tabbar" id="tabbar">
  <button class="newtab-btn" onclick="newTab()">+</button>
</div>

<div class="addrbar">
  <button class="nav-btn" id="backBtn" onclick="goBack()" disabled>←</button>
  <button class="nav-btn" id="fwdBtn" onclick="goForward()" disabled>→</button>
  <button class="nav-btn" onclick="reload()">↻</button>
  <input class="addr-input" id="addrInput" placeholder="Enter URL or search..." onkeydown="if(event.key==='Enter')navigate()">
  <button class="go-btn" onclick="navigate()">→</button>
  <button class="home-btn" onclick="goHome()" title="Home">H</button>
  <div class="zoom-controls">

  </div>

  <button class="settings-btn" onclick="openSettings()" title="Settings">S</button>
  <button class="settings-btn" onclick="viewSource()" title="View source">&lt;/&gt;</button>
</div>

<div class="bookmarks-bar" id="bookmarksBar"></div>

<div class="mp-bar" id="mpBar">
  <span class="mp-status" id="mpStatus">Not connected</span>
  <div class="mp-peers" id="mpPeers"></div>
  <button class="mp-btn" onclick="mpHost()">Host Room</button>
  <button class="mp-btn" onclick="mpJoin()">Join Room</button>
  <button class="mp-btn" id="mpChatBtn" onclick="mpToggleChat()" style="display:none">Chat</button>
  <button class="mp-btn" id="mpFollowBtn" onclick="mpToggleFollow()" style="display:none">Follow: on</button>
  <button class="mp-btn" id="mpCursorsBtn" onclick="mpToggleCursors()" style="display:none">Cursors: on</button>
  <button class="mp-btn" id="mpShareBtn" onclick="mpToggleShare()" style="display:none">Share screen</button>
  <button class="mp-btn" id="mpLeaveBtn" onclick="mpLeave()" style="display:none">Leave</button>
</div>
<div class="mp-chat" id="mpChat">
  <div class="mp-chat-header">
    <span>Room Chat</span>
    <span class="mp-chat-who" id="mpChatWho" onclick="mpRename()" title="click to change your name">you</span>
    <span class="close" onclick="mpToggleChat()">×</span>
  </div>
  <div class="mp-chat-messages" id="mpChatMessages"></div>
  <div class="mp-chat-input">
    <input type="text" id="mpChatInput" placeholder="Message the room..." maxlength="500" onkeydown="mpChatKey(event)">
    <button onclick="mpSendChat()">Send</button>
  </div>
</div>
<div class="content" id="content"></div>
<div id="mpShareView" style="display:none;position:fixed;inset:0;z-index:70;background:#000;">
  <video id="mpShareVideo" autoplay playsinline style="width:100%;height:100%;object-fit:contain;"></video>
  <button onclick="mpStopViewing()" style="position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;border:1px solid #555;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;">close</button>
  <div id="mpShareLabel" style="position:absolute;bottom:12px;left:12px;color:#fff;font-size:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;"></div>
</div>
<div id="findBarContainer"></div>

<div class="statusbar" id="statusbar">Ready</div>

<script src="wordle-words.js"></script>
<script>
const PROXY = '/api/proxy?url=';

let tabs = [];
let activeTab = null;
let tabCounter = 0;

const SHORTCUTS = [
  { icon: '🟩', label: 'Wordle', cfb: 'wordle' },
  { icon: '🎮', label: 'Games', cfb: 'games' },
  { icon: '🔍', label: 'Search', cfb: 'search' },
  { icon: '📰', label: 'News', cfb: 'news' },
  { icon: '📋', label: 'Sites', cfb: 'websites' },
  { icon: '📝', label: 'Updates', cfb: 'updates' },
  { icon: '📖', label: 'Wikipedia', url: 'https://en.wikipedia.org' },
];

function newTab(url) {
  const id = ++tabCounter;
  const tab = { id, url: url || null, title: 'New Tab', history: [], histIdx: -1, loading: false, pinned: false, zoom: 1, view: null, frame: null };
  tabs.push(tab);
  activeTab = tab;
  renderTabs();
  if (url) {
    loadUrl(tab, url);
  } else {
    showNewTab(tab);
  }
}

function closeTab(id, e) {
  if (e) e.stopPropagation();
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  if (tabs[idx].pinned) { tabs[idx].pinned = false; renderTabs(); return; }
  disposeView(tabs[idx]);
  tabs.splice(idx, 1);
  if (activeTab && activeTab.id === id) {
    activeTab = tabs.length > 0 ? tabs[Math.max(0, idx - 1)] : null;
  }
  if (tabs.length === 0) newTab();
  renderTabs();
  renderContent();
  updateAddrBar();
  updateNavButtons();
  updateStarBtn();
}

function switchTab(id) {
  activeTab = tabs.find(t => t.id === id);
  renderTabs();
  renderContent();
  clearProxyHint();
  updateAddrBar();
  updateNavButtons();
  applyZoom();
  updateStarBtn();
}

function renderTabs() {
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '<button class="newtab-btn" onclick="newTab()">+</button>';
  tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.pinned ? ' pinned' : '') + (activeTab && activeTab.id === tab.id ? ' active' : '');
    el.onclick = () => switchTab(tab.id);
    el.innerHTML = `<span class="pin" onclick="togglePin(${tab.id}, event)" title="Pin">P</span><span style="overflow:hidden;text-overflow:ellipsis">${tab.title}</span><span class="close" onclick="closeTab(${tab.id}, event)">×</span>`;
    bar.insertBefore(el, bar.lastChild);
  });
}

function updateAddrBar() {
  const input = document.getElementById('addrInput');
  if (activeTab && activeTab.url) {
    try {
      const u = new URL(activeTab.url);
      input.value = u.href;
    } catch {
      input.value = activeTab.url;
    }
  } else {
    input.value = '';
  }
}

function updateNavButtons() {
  if (!activeTab) return;
  document.getElementById('backBtn').disabled = activeTab.histIdx <= 0;
  document.getElementById('fwdBtn').disabled = activeTab.histIdx >= activeTab.history.length - 1;
}

// ===== TAB VIEWS =====
// every tab keeps its own persistent view node, so switching tabs is instant and
// never re-fetches the page (and never leaves you staring at a blank content area)
function ensureView(tab) {
  if (tab.view && tab.view.isConnected) return tab.view;
  const view = document.createElement('div');
  view.className = 'tabview';
  tab.view = view;
  document.getElementById('content').appendChild(view);
  return view;
}

function showView(tab) {
  const content = document.getElementById('content');
  if (!content) return;
  Array.from(content.children).forEach(el => { el.hidden = !(tab && el === tab.view); });
}

function disposeView(tab) {
  if (tab.view) { tab.view.remove(); tab.view = null; }
  tab.frame = null;
}

function renderContent() { showView(activeTab); }

function tabView(tab) {
  const view = ensureView(tab);
  showView(tab);
  return view;
}

function setStatusText(text) {
  const el = document.getElementById('statusbar');
  if (el) el.textContent = text;
}

function hostLabel(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return String(url || ''); }
}

function cleanTitle(title, url) {
  const t = String(title || '').replace(/\s+/g, ' ').trim();
  if (!t || /^(loading\.\.\.|untitled|error|new tab)$/i.test(t)) return hostLabel(url);
  return t.slice(0, 80);
}

function clearProxyHint() {
  const el = document.getElementById('proxyHint');
  if (el) el.remove();
}

function showProxyHint(url, message) {
  clearProxyHint();
  const bar = document.createElement('div');
  bar.id = 'proxyHint';
  bar.className = 'proxy-hint';
  const label = document.createElement('span');
  label.textContent = message || 'this page came back blank — it probably needs javascript the proxy cannot run.';
  const open = document.createElement('button');
  open.textContent = 'open without proxy';
  open.onclick = () => window.open(url, '_blank', 'noopener');
  const close = document.createElement('button');
  close.className = 'ghost';
  close.textContent = 'dismiss';
  close.onclick = clearProxyHint;
  bar.append(label, open, close);
  document.body.appendChild(bar);
}

const CAPTCHA_SEL = 'iframe[src*="recaptcha"], iframe[src*="hcaptcha"], iframe[src*="challenges.cloudflare.com"], iframe[src*="turnstile"], iframe[src*="arkoselabs"], .g-recaptcha, .h-captcha, .cf-turnstile';
const WALL_TEXT = /invalid domain for site key|error for site owner|prove your humanity|verify (that )?you are (a )?human|unusual traffic|checking your browser|captcha/i;

function checkBlank(tab, frame, url) {
  if (!tab || tab !== activeTab || tab.frame !== frame) return;
  let doc;
  try { doc = frame.contentDocument; } catch { return; }
  if (!doc || !doc.body) return;

  const text = (doc.body.innerText || '').trim();

  // captcha / bot walls can never work through a proxy: the widget checks that the
  // page's domain matches the key's registered domain, and our domain is pages.dev
  let captcha = false;
  try { captcha = !!doc.querySelector(CAPTCHA_SEL); } catch {}
  if (captcha || WALL_TEXT.test(text.slice(0, 4000))) {
    showProxyHint(url, 'this site runs a captcha or bot wall tied to its own domain — a proxy can never pass it. open it directly instead.');
    return;
  }

  let empty = false;
  const media = Array.from(doc.querySelectorAll('img, video, canvas, svg, picture, iframe')).some(el => {
    try {
      const r = el.getBoundingClientRect();
      return r.width > 40 && r.height > 40;
    } catch { return false; }
  });
  empty = text.length === 0 && !media;
  if (empty) showProxyHint(url);
}

function showNewTab(tab) {
  const view = tabView(tab);
  tab.frame = null;
  tab.loading = false;
  tab.title = 'New Tab';
  clearProxyHint();
  const tiles = SHORTCUTS.map(s => {
    const action = s.cfb ? "openCfb('" + s.cfb + "')" : "navigateTo('" + s.url + "')";
    return '<div class="shortcut" onclick="' + action + '"><div class="icon">' + s.icon + '</div><div class="label">' + s.label + '</div></div>';
  }).join('');
  view.innerHTML = '<div class="newtab"><h1>CF Browser</h1><p>enter a url, or type <b>wordle</b></p><div class="shortcuts">' +
    tiles + '</div></div>';
  renderTabs();
  updateAddrBar();
  setStatusText('New Tab');
}

function showLoading() {
  if (!activeTab) return;
  const view = tabView(activeTab);
  view.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading...</div></div>';
}

function showError(url, msg) {
  if (!activeTab) return;
  const view = tabView(activeTab);
  view.innerHTML = '<div class="error-page"><h2>⚠️ Can\'t load this page</h2><div class="url">' +
    escapeHtml(url) + '</div><div>' + escapeHtml(msg) + '</div>' +
    '<div style="margin-top:12px;font-size:12px;color:#555">some sites block proxying or need javascript that cannot run through a proxy.</div></div>';
}

function rawTarget(raw) {
  let u = String(raw || '');
  if (u.startsWith(PROXY)) u = u.slice(PROXY.length);
  try { return decodeURIComponent(u); } catch { return u; }
}

function loadIntoFrame(tab, url) {
  const view = tabView(tab);
  view.innerHTML = '';
  clearProxyHint();

  const frame = document.createElement('iframe');
  frame.className = 'webview';
  frame.src = PROXY + encodeURIComponent(url);
  tab.frame = frame;

  let settled = false;
  const finish = () => {
    if (settled) return;
    settled = true;
    tab.loading = false;
    let title = '';
    try { title = frame.contentDocument ? frame.contentDocument.title : ''; } catch {}
    tab.title = cleanTitle(title, url);
    renderTabs();
    setStatusText('Done');
    setTimeout(() => checkBlank(tab, frame, url), 1200);
  };

  frame.onload = finish;
  frame.onerror = () => {
    settled = true;
    tab.loading = false;
    tab.title = hostLabel(url);
    renderTabs();
    showError(url, 'the proxy could not reach that page');
  };

  view.appendChild(frame);
  applyZoom();

  // never sit on "Loading..." forever
  setTimeout(() => {
    if (settled) return;
    settled = true;
    tab.loading = false;
    tab.title = cleanTitle('', url);
    renderTabs();
    setStatusText('still loading — the site may be blocking the proxy');
  }, 15000);
}

function cfbPageFrom(url) {
  const s = String(url || '').trim();
  const m = s.match(/^cf(?:b)?(?:::|:\/\/|:)\s*\/?\s*([a-z0-9_-]+)/i);
  return m ? m[1].toLowerCase() : null;
}

function loadUrl(tab, url) {
  if (!url) return;

  // internal cfb:: pages never go through the proxy
  const cfbPage = cfbPageFrom(url);
  if (cfbPage) {
    tab.url = url;
    tab.title = 'cfb::' + cfbPage;
    if (tab.histIdx < tab.history.length - 1) tab.history = tab.history.slice(0, tab.histIdx + 1);
    tab.history.push(tab.url);
    tab.histIdx = tab.history.length - 1;
    renderTabs();
    updateNavButtons();
    updateAddrBar();
    updateStarBtn();
    showCfbPage(tab, cfbPage);
    return;
  }

  // Normalize URL
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    if (url.includes('.') && !url.includes(' ')) {
      url = 'https://' + url;
    } else {
      // duckduckgo instead of google: google bans cloudflare worker IPs
      url = 'https://www.bing.com/search?q=' + encodeURIComponent(url);
    }
  }

  tab.url = url;
  tab.loading = true;
  tab.title = hostLabel(url);
  renderTabs();
  setStatusText('Loading ' + url + '...');

  // Add to history
  if (tab.histIdx < tab.history.length - 1) {
    tab.history = tab.history.slice(0, tab.histIdx + 1);
  }
  tab.history.push(url);
  tab.histIdx = tab.history.length - 1;
  updateNavButtons();
  updateAddrBar();
  updateStarBtn();

  loadIntoFrame(tab, url);
}

// one listener for every proxied page (previously one got added per navigation and piled up)
window.addEventListener('message', (e) => {
  const data = e.data;
  if (!data || typeof data !== 'object' || !data.type) return;
  const tab = activeTab;
  if (!tab) return;

  if (data.type === 'navigate') {
    const target = rawTarget(data.url);
    if (target) loadUrl(tab, target);
    return;
  }

  if (data.type === 'cursor') {
    const frame = tab.frame;
    if (!frame || !frame.isConnected) return;
    const r = frame.getBoundingClientRect();
    const x = (r.left + data.x * r.width) / Math.max(1, window.innerWidth);
    const y = (r.top + data.y * r.height) / Math.max(1, window.innerHeight);
    mpSendCursor(x, y);
    return;
  }

  if (data.type === 'click') {
    const frame = tab.frame;
    if (!frame || !frame.isConnected) return;
    const r = frame.getBoundingClientRect();
    const x = (r.left + data.x * r.width) / Math.max(1, window.innerWidth);
    const y = (r.top + data.y * r.height) / Math.max(1, window.innerHeight);
    mpSendClick(x, y);
    return;
  }

  if (data.type === 'scroll') {
    const frame = tab.frame;
    if (!frame || !frame.isConnected) return;
    mpSendScroll(data.y);
    return;
  }

  if (data.type === 'input') {
    const frame = tab.frame;
    if (!frame || !frame.isConnected) return;
    mpSendInput(data);
    return;
  }

  if (data.type === 'snapshot') {
    const frame = tab.frame;
    if (!frame || !frame.isConnected) return;
    mpSendSnapshot(data.html);
    return;
  }

  if (data.type === 'pageerror') {
    const frame = tab.frame;
    if (!frame || !frame.isConnected) return;
    const url = tab.url;
    let attempts = 0;
    const check = () => {
      if (!frame.isConnected || tab.frame !== frame || tab.url !== url) return;
      let visibleText = '';
      try { visibleText = (frame.contentDocument.body.innerText || '').trim(); } catch { return; }
      if (visibleText.length > 120) return; // loaded fine
      attempts++;
      if (attempts < 4) {
        setTimeout(check, 1500);
      } else {
        showProxyHint(url, 'this page may need JavaScript that cannot run through the proxy');
      }
    };
    setTimeout(check, 1500);
    return;
  }
});

// click on the page body clears the blank-page hint
document.addEventListener('click', (e) => {
  if (e.target && e.target.closest && e.target.closest('.proxy-hint')) return;
  clearProxyHint();
}, true);

function navigate() {
  const input = document.getElementById('addrInput');
  let url = input.value.trim();
  if (!url || !activeTab) return;
  if (url.toLowerCase() === 'wordle') url = 'cfb::wordle';
  loadUrl(activeTab, url);
}

function showCfbPage(tab, page) {
  const content = document.getElementById('content');
  let html = '';
  switch (page) {
    case 'settings':
      html = '<div class="cfb-page"><h1>Settings</h1>' +
        '<div class="item"><div><div class="title">Homepage</div><div class="url">used by the Home button</div></div>' +
        '<input id="setHome" type="text" value="' + escapeHtml(localStorage.getItem('cfb_homepage') || 'https://www.google.com') +
        '" style="width:230px;padding:6px 8px;border-radius:6px;border:1px solid #3a3a5e;background:#0f0f1a;color:#e0e0e0;font-size:12px;"></div>' +
        '<div class="item"><div><div class="title">Theme</div><div class="url">color scheme</div></div>' +
        '<select id="setTheme" style="padding:6px 8px;border-radius:6px;border:1px solid #3a3a5e;background:#0f0f1a;color:#e0e0e0;font-size:12px;">' +
        '<option value="dark">dark (default)</option>' +
        '<option value="light">light</option>' +
        '<option value="midnight">midnight (cyan)</option>' +
        '<option value="forest">forest (green)</option>' +
        '<option value="sunset">sunset (orange)</option>' +
        '</select></div>' +
        '<div style="margin-top:14px;display:flex;gap:8px;">' +
        '<button onclick="cfbSetSettings()" style="background:#7c5cff;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;">Save</button>' +
        '<button onclick="if(confirm(\'clear all browser data?\')){localStorage.clear();location.reload();}" style="background:transparent;border:1px solid #3a3a5e;color:#9a9ab0;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;">Reset all data</button>' +
        '</div></div>';
      break;
    case 'cookies':
      html = '<div class="cfb-page"><h1>Cookies</h1>' +
        '<p style="color:#888;font-size:12px;margin-bottom:14px;">cookies stored by the browser shell (proxied sites keep their own, forwarded where possible).</p>' +

    '<div id="tttMsg" style="text-align:center;font-size:13px;color:#9a9ab0;height:18px;margin-bottom:10px;"></div>' +
    '<div style="display:flex;gap:8px;justify-content:center;">' +

    '<button onclick="tttMode(\'cpu\')" style="background:transparent;border:1px solid #34344c;color:#9a9ab0;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer;">vs cpu</button>' +
    '<button onclick="tttReset()" style="background:transparent;border:1px solid #34344c;color:#9a9ab0;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer;">reset</button>' +
    '</div></div>';

let tttState = { board: Array(9).fill(''), turn: 'X', mode: 'pvp', over: false };
function tttRender() {
  const el = document.getElementById('tttBoard');
  if (!el) return;
  el.innerHTML = '';
  tttState.board.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.style.cssText = 'width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;border-radius:8px;border:2px solid #2e2e48;background:#12121c;color:#fff;cursor:pointer;';
    cell.textContent = v;
    if (v === 'X') cell.style.color = '#7c5cff';
    if (v === 'O') cell.style.color = '#56d18a';
    cell.onclick = () => tttMove(i);
    el.appendChild(cell);
  });
  const msg = document.getElementById('tttMsg');
  if (msg) {
    if (tttState.over) {
      if (tttState.winner === 'draw') msg.textContent = "it's a draw";
      else msg.textContent = tttState.winner + ' wins!';
    } else {
      msg.textContent = tttState.turn + "'s turn";
    }
  }
}

function tttCheckWin(b) {
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for (const [a,c,d] of lines) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
  }
  if (b.every(x => x)) return 'draw';
  return null;
}

function tttMove(i) {
  if (tttState.over || tttState.board[i]) return;
  tttState.board[i] = tttState.turn;
  const w = tttCheckWin(tttState.board);
  if (w) { tttState.over = true; tttState.winner = w; }
  else { tttState.turn = tttState.turn === 'X' ? 'O' : 'X'; }
  tttRender();
  if (!tttState.over && tttState.mode === 'cpu' && tttState.turn === 'O') {
    setTimeout(tttCpuMove, 300);
  }
}

function tttCpuMove() {
  if (tttState.over) return;
  // simple: try to win, block, center, corner, else random
  const b = tttState.board;
  let move = -1;
  // win
  for (let i = 0; i < 9; i++) {
    if (!b[i]) { b[i] = 'O'; if (tttCheckWin(b) === 'O') { move = i; b[i] = ''; break; } b[i] = ''; }
  }
  // block
  if (move < 0) for (let i = 0; i < 9; i++) {
    if (!b[i]) { b[i] = 'X'; if (tttCheckWin(b) === 'X') { move = i; b[i] = ''; break; } b[i] = ''; }
  }
  // center
  if (move < 0 && !b[4]) move = 4;
  // corners
  if (move < 0) { const corners = [0,2,6,8].filter(i => !b[i]); if (corners.length) move = corners[Math.floor(Math.random()*corners.length)]; }
  // sides
  if (move < 0) { const sides = [1,3,5,7].filter(i => !b[i]); if (sides.length) move = sides[Math.floor(Math.random()*sides.length)]; }
  if (move >= 0) tttMove(move);
}

function tttMode(m) { tttState.mode = m; tttReset(); }
function tttReset() { tttState = { board: Array(9).fill(''), turn: 'X', mode: tttState.mode, over: false, winner: null }; tttRender(); }

// ===== SEARCH =====
async function cfbSearch() {
  const inp = document.getElementById('cfbSearchInput');
  const res = document.getElementById('cfbSearchResults');
  if (!inp || !res) return;
  const q = inp.value.trim();
  if (!q) return;
  res.innerHTML = '<p style="color:#888;">searching...</p>';
  try {
    const proxyUrl = '/api/proxy?url=' + encodeURIComponent('https://www.bing.com/search?q=' + encodeURIComponent(q));
    const r = await fetch(proxyUrl);
    const html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // bing results: .b_algo contains title (h2 a), url (cite), snippet (p or .b_caption p)
    const items = doc.querySelectorAll('.b_algo');
    if (!items.length) {
      // fallback: show raw text
      res.innerHTML = '<p style="color:#888;">no parsed results. <a href="#" onclick="loadUrl(activeTab,\'https://www.bing.com/search?q=' + encodeURIComponent(q) + '\');return false;" style="color:#7c5cff;">open results page</a></p>';
      return;
    }
    let out = '';
    items.forEach(item => {
      const a = item.querySelector('h2 a');
      const cite = item.querySelector('cite');
      const snippet = item.querySelector('.b_caption p, p');
      if (!a) return;
      const title = a.textContent.trim();
      const href = a.getAttribute('href') || '';
      const url = cite ? cite.textContent.trim() : href;
      const desc = snippet ? snippet.textContent.trim() : '';
      out += '<div class="item"><div><div class="title">' + escapeHtml(title) + '</div><div class="url">' + escapeHtml(url) + '</div>' +
        (desc ? '<div style="color:#888;font-size:11px;margin-top:4px;">' + escapeHtml(desc.slice(0,200)) + '</div>' : '') +
        '</div><button onclick="loadUrl(activeTab,\'' + href.replace(/'/g, "\\'") + '\')">Open</button></div>';
    });
    res.innerHTML = out || '<p style="color:#888;">no results found.</p>';
  } catch (e) {
    res.innerHTML = '<p style="color:#e2685f;">search failed: ' + escapeHtml(e.message) + '</p>';
  }
}

    const html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // try article, main, or body
    const article = doc.querySelector('article') || doc.querySelector('main') || doc.querySelector('[role="main"]') || doc.body;
    // extract text from paragraphs
    const paras = article.querySelectorAll('p, h1, h2, h3, h4, li');
    let text = '';
    paras.forEach(p => {
      const t = p.textContent.trim();
      if (t.length > 20) text += '<p>' + escapeHtml(t) + '</p>';
    });
    if (!text) text = '<p style="color:#888;">could not extract article text. try opening the page directly.</p>';
    // get title
    const title = doc.querySelector('title');
    const h = title ? '<h2 style="color:var(--text);margin-bottom:12px;">' + escapeHtml(title.textContent) + '</h2>' : '';
    out.innerHTML = h + text;
  } catch (e) {
    out.innerHTML = '<p style="color:#e2685f;">failed: ' + escapeHtml(e.message) + '</p>';
  }
}

// ===== CALCULATOR =====
function cfbInitCalc() {
  const display = document.getElementById('calcDisplay');
  const keys = document.getElementById('calcKeys');
  if (!display || !keys) return;
  const layout = ['C','⌫','%', '÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  keys.innerHTML = '';
  layout.forEach(k => {
    const btn = document.createElement('button');
    btn.textContent = k;
    btn.style.cssText = 'padding:12px;border-radius:6px;border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;';
    if (k === '=') { btn.style.background = 'var(--accent)'; btn.style.color = '#fff'; }
    else if (['C','⌫','%','÷','×','−','+'].includes(k)) { btn.style.background = 'var(--surface2)'; btn.style.color = 'var(--text)'; }
    else { btn.style.background = 'var(--bg3)'; btn.style.color = 'var(--text)'; }
    btn.onclick = () => cfbCalcKey(k, display);
    keys.appendChild(btn);
  });
}

function cfbCalcKey(k, display) {
  if (!display) display = document.getElementById('calcDisplay');
  if (!display) return;
  if (k === 'C') { display.value = ''; return; }
  if (k === '⌫') { display.value = display.value.slice(0, -1); return; }
  if (k === '=') {
    try {
      const expr = display.value.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      display.value = String(Function('"use strict"; return (' + expr + ')')());
    } catch { display.value = 'Error'; }
    return;
  }
  display.value += k;
}

function cfbTermPrint(text) {
  const out = document.getElementById('termOutput');
  if (!out) return;
  out.textContent += text + '\n';
  out.scrollTop = out.scrollHeight;
}

function cfbTermKey(e) { if (e.key === 'Enter') cfbTerm(); }

function cfbTerm() {
  const inp = document.getElementById('termInput');
  const out = document.getElementById('termOutput');
  if (!inp || !out) return;
  const cmd = inp.value.trim();
  inp.value = '';
  cfbTermPrint('$ ' + cmd);
  const parts = cmd.split(/\s+/);
  const c = parts[0].toLowerCase();
  const args = parts.slice(1);
  switch (c) {
    case '': break;
    case 'help':
      cfbTermPrint('commands: help, clear, date, echo, calc, ls, about, theme');
      break;
    case 'clear':
      out.textContent = '';
      break;
    case 'date':
      cfbTermPrint(new Date().toString());
      break;
    case 'echo':
      cfbTermPrint(args.join(' '));
      break;
    case 'calc':
      try {
        const expr = args.join(' ').replace(/×/g, '*').replace(/÷/g, '/');
        cfbTermPrint(String(Function('"use strict"; return (' + expr + ')')()));
      } catch { cfbTermPrint('error'); }
      break;
    case 'about':
      cfbTermPrint('cf-browser terminal v1.0\\npowered by cf-browser');
      break;
    case 'ls':
      cfbTermPrint('notes.txt  readme.md  (virtual)');
      break;
    case 'theme':
      if (args[0]) {
        try { localStorage.setItem('cfb_theme', args[0]); cfbApplyTheme(); cfbTermPrint('theme set to ' + args[0]); } catch { cfbTermPrint('error'); }
      } else {
        cfbTermPrint('usage: theme <dark|light|midnight|forest|sunset>');
      }
      break;
    default:
      cfbTermPrint('command not found: ' + c);
  }
}

// ===== WORDLE =====
// nyt wordle is a client-side app behind a bot wall, so a proxy can only ever hand
// back an empty shell. this is a native one instead: no network, no proxy, always works.
const WDL_DAILY_KEY = 'cfb_wordle_daily';
const WDL_STATS_KEY = 'cfb_wordle_stats';
const WDL_MODE_KEY = 'cfb_wordle_mode';
const WDL_FALLBACK = 'about other which their there first would these state email world music after video where books links years';

let WDL_DATA = null;
function wdlData() {
  if (WDL_DATA) return WDL_DATA;
  const raw = window.WORDLE_WORDS;
  const answers = raw && raw.answers ? raw.answers.split(' ') : WDL_FALLBACK.split(' ');
  const valid = new Set(raw && raw.valid ? raw.valid.split(' ') : answers);
  WDL_DATA = { answers, valid };
  return WDL_DATA;
}

let wdl = null;
let wdlBusy = false;
let wdlSuppress = false;

function wdlDayNum() {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

function wdlDailyAnswer(dayNum) {
  const answers = wdlData().answers;
  // every step has to be forced back into unsigned territory: bitwise ops in js
  // return signed int32, so a negative hash would index off the end of the array
  let x = (dayNum * 2654435761) >>> 0;
  x = (x ^ (x >>> 15)) >>> 0;
  x = Math.imul(x, 2246822519) >>> 0;
  x = (x ^ (x >>> 13)) >>> 0;
  return answers[x % answers.length] || answers[0];
}

function wdlLoadDaily() {
  try { return JSON.parse(localStorage.getItem(WDL_DAILY_KEY) || 'null'); } catch { return null; }
}

function wdlSave() {
  if (!wdl || wdl.mode !== 'daily') return;
  try {
    localStorage.setItem(WDL_DAILY_KEY, JSON.stringify({
      day: wdl.day, answer: wdl.answer, guesses: wdl.guesses, done: wdl.done,
    }));
  } catch {}
}

function wdlGetStats() {
  try {
    const s = JSON.parse(localStorage.getItem(WDL_STATS_KEY) || 'null');
    if (s && Array.isArray(s.dist)) return s;
  } catch {}
  return { played: 0, wins: 0, streak: 0, max: 0, dist: [0, 0, 0, 0, 0, 0] };
}

function wdlRecord(won) {
  if (!wdl || wdl.mode !== 'daily' || wdl.scored) return;
  wdl.scored = true;
  const s = wdlGetStats();
  s.played++;
  if (won) {
    s.wins++;
    s.streak++;
    s.max = Math.max(s.max, s.streak);
    s.dist[Math.min(5, wdl.guesses.length - 1)]++;
  } else {
    s.streak = 0;
  }
  try { localStorage.setItem(WDL_STATS_KEY, JSON.stringify(s)); } catch {}
}

function wdlScore(guess, answer) {
  const res = ['absent', 'absent', 'absent', 'absent', 'absent'];
  const pool = answer.split('');
  for (let i = 0; i < 5; i++) {
    if (guess[i] === pool[i]) { res[i] = 'correct'; pool[i] = ''; }
  }
  for (let i = 0; i < 5; i++) {
    if (res[i] === 'correct') continue;
    const j = pool.indexOf(guess[i]);
    if (j > -1) { res[i] = 'present'; pool[j] = ''; }
  }
  return res;
}

function wdlPage() {
  const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  let kb = '';
  rows.forEach((row, ri) => {
    let keys = '';
    if (ri === 2) keys += '<button class="wd-key wide" data-key="enter">enter</button>';
    for (const ch of row) keys += '<button class="wd-key" data-key="' + ch + '">' + ch + '</button>';
    if (ri === 2) keys += '<button class="wd-key wide" data-key="back">del</button>';
    kb += '<div class="wd-kbrow">' + keys + '</div>';
  });

  let grid = '';
  for (let r = 0; r < 6; r++) {
    grid += '<div class="wd-row" id="wdRow' + r + '">';
    for (let c = 0; c < 5; c++) grid += '<div class="wd-tile" id="wdTile' + r + '-' + c + '"></div>';
    grid += '</div>';
  }

  return '<div class="cfb-page wd">' +
    '<h1>Wordle</h1>' +
    '<div class="wd-sub">guess the 5 letter word in 6 tries</div>' +
    '<div class="wd-grid" id="wdGrid">' + grid + '</div>' +
    '<div class="wd-msg" id="wdMsg"></div>' +
    '<div class="wd-kb" id="wdKb">' + kb + '</div>' +
    '<div class="wd-foot">' +
      '<select id="wdMode"><option value="daily">daily</option><option value="practice">practice</option></select>' +
      '<button onclick="wdlNewWord()">new word</button>' +
      '<button onclick="wdlShare()">share</button>' +
    '</div>' +
    '<div class="wd-stats" id="wdStats"></div>' +
    '</div>';
}

function wdlInit() {
  let mode = 'daily';
  try { mode = localStorage.getItem(WDL_MODE_KEY) || 'daily'; } catch {}
  const answers = wdlData().answers;
  const day = wdlDayNum();

  if (mode !== 'practice') {
    const saved = wdlLoadDaily();
    if (saved && saved.day === day && Array.isArray(saved.guesses)) {
      wdl = {
        mode: 'daily', day,
        answer: saved.answer || wdlDailyAnswer(day),
        guesses: saved.guesses.slice(0, 6),
        current: '', done: !!saved.done, msg: '', msgKind: '',
      };
    } else {
      wdl = { mode: 'daily', day, answer: wdlDailyAnswer(day), guesses: [], current: '', done: false, msg: '', msgKind: '' };
      wdlSave();
    }
  } else {
    wdl = {
      mode: 'practice', day,
      answer: answers[Math.floor(Math.random() * answers.length)],
      guesses: [], current: '', done: false, msg: '', msgKind: '',
    };
  }

  wdlBusy = false;
  if (wdl.done && wdl.guesses.length) {
    const won = wdl.guesses[wdl.guesses.length - 1] === wdl.answer;
    wdl.msg = won ? 'you already got this one in ' + wdl.guesses.length : 'the word was ' + wdl.answer.toUpperCase();
    wdl.msgKind = won ? 'good' : 'bad';
  }
  wdlRender();
}

function wdlRender() {
  if (!wdl) return;
  const grid = document.getElementById('wdGrid');
  if (!grid) return;

  for (let r = 0; r < 6; r++) {
    const guess = wdl.guesses[r];
    const cur = (r === wdl.guesses.length && !wdl.done) ? wdl.current : '';
    const text = guess || cur || '';
    for (let c = 0; c < 5; c++) {
      const tile = document.getElementById('wdTile' + r + '-' + c);
      if (!tile) continue;
      tile.textContent = text[c] || '';
      tile.className = 'wd-tile' + (text[c] ? ' filled' : '');
    }
  }

  wdl.guesses.forEach((g, r) => {
    const res = wdlScore(g, wdl.answer);
    for (let c = 0; c < 5; c++) {
      const tile = document.getElementById('wdTile' + r + '-' + c);
      if (tile) tile.classList.add(res[c]);
    }
  });

  wdlRenderKeys();
  wdlRenderStats();

  const msg = document.getElementById('wdMsg');
  if (msg) { msg.textContent = wdl.msg || ''; msg.className = 'wd-msg ' + (wdl.msgKind || ''); }

  const sel = document.getElementById('wdMode');
  if (sel) sel.value = wdl.mode === 'daily' ? 'daily' : 'practice';
}

function wdlRenderKeys() {
  const best = {};
  const rank = { absent: 1, present: 2, correct: 3 };
  if (wdl) {
    wdl.guesses.forEach(g => {
      const res = wdlScore(g, wdl.answer);
      for (let i = 0; i < 5; i++) {
        const ch = g[i];
        if (!best[ch] || rank[res[i]] > rank[best[ch]]) best[ch] = res[i];
      }
    });
  }
  document.querySelectorAll('.wd-key[data-key]').forEach(btn => {
    const k = btn.dataset.key;
    btn.classList.remove('correct', 'present', 'absent');
    if (best[k]) btn.classList.add(best[k]);
  });
}

function wdlRenderStats() {
  const el = document.getElementById('wdStats');
  if (!el) return;
  const s = wdlGetStats();
  const pct = s.played ? Math.round((s.wins / s.played) * 100) : 0;
  el.textContent = 'played ' + s.played + ' · win ' + pct + '% · streak ' + s.streak + ' · best ' + s.max;
}

function wdlMsg(text, kind, shake) {
  if (!wdl) return;
  wdl.msg = text;
  wdl.msgKind = kind || '';
  const el = document.getElementById('wdMsg');
  if (el) { el.textContent = text; el.className = 'wd-msg ' + (kind || ''); }
  if (shake) {
    const row = document.getElementById('wdRow' + wdl.guesses.length);
    if (row) { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }
  }
}

function wdlInput(ch) {
  if (!wdl || wdl.done || wdlBusy) return;
  if (wdl.current.length >= 5) return;
  wdl.current += ch;
  wdl.msg = '';
  wdl.msgKind = '';
  wdlRender();
}

function wdlBack() {
  if (!wdl || wdl.done || wdlBusy) return;
  wdl.current = wdl.current.slice(0, -1);
  wdlRender();
}

function wdlKey(k) {
  if (!wdl) return;
  if (k === 'enter') { wdlSubmit(); return; }
  if (k === 'back' || k === 'backspace' || k === 'del') { wdlBack(); return; }
  if (/^[a-z]$/.test(k)) wdlInput(k);
}

function wdlSubmit() {
  if (!wdl || wdl.done || wdlBusy) return;
  const guess = wdl.current.toLowerCase();
  if (guess.length < 5) { wdlMsg('not enough letters', 'bad', true); return; }
  if (!wdlData().valid.has(guess)) { wdlMsg('not in the word list', 'bad', true); return; }

  const answer = wdl.answer;
  const res = wdlScore(guess, answer);
  const rowIdx = wdl.guesses.length;

  wdl.guesses.push(guess);
  wdl.current = '';
  if (mpWs && mpWs.readyState === WebSocket.OPEN && !wdlSuppress) {
    try { mpWs.send(JSON.stringify({ type: 'wordle', guess, answer: wdl.answer, by: mpPeerId })); } catch (e) {}
  }
  wdl.msg = '';
  wdl.msgKind = '';
  wdlBusy = true;

  for (let c = 0; c < 5; c++) {
    const tile = document.getElementById('wdTile' + rowIdx + '-' + c);
    if (tile) { tile.textContent = guess[c]; tile.className = 'wd-tile filled'; }
  }
  const msgEl = document.getElementById('wdMsg');
  if (msgEl) { msgEl.textContent = ''; msgEl.className = 'wd-msg'; }

  for (let c = 0; c < 5; c++) {
    setTimeout(() => {
      const tile = document.getElementById('wdTile' + rowIdx + '-' + c);
      if (!tile) return;
      tile.classList.add('flip');
      setTimeout(() => tile.classList.add(res[c]), 120);
    }, c * 170);
  }

  setTimeout(() => {
    wdlBusy = false;
    const won = guess === answer;
    if (won) {
      wdl.done = true;
      wdl.msg = wdl.guesses.length === 1 ? 'one try. unreal.' : 'got it in ' + wdl.guesses.length + '!';
      wdl.msgKind = 'good';
    } else if (wdl.guesses.length >= 6) {
      wdl.done = true;
      wdl.msg = 'the word was ' + answer.toUpperCase();
      wdl.msgKind = 'bad';
    }
    if (wdl.done) wdlRecord(won);
    wdlSave();
    wdlRenderKeys();
    wdlRenderStats();
    const el = document.getElementById('wdMsg');
    if (el) { el.textContent = wdl.msg || ''; el.className = 'wd-msg ' + (wdl.msgKind || ''); }
  }, 5 * 170 + 220);
}

function wdlApplyRemote(guess, answer) {
  if (!wdl || !guess) return;
  if (answer) wdl.answer = answer;
  // avoid double-applying the same guess
  if (wdl.guesses.length && wdl.guesses[wdl.guesses.length - 1] === guess) return;
  wdl.guesses.push(String(guess).toLowerCase());
  wdl.current = '';
  wdlBusy = false;
  const won = wdl.guesses[wdl.guesses.length - 1] === wdl.answer;
  if (won) { wdl.done = true; wdl.msg = 'got it in ' + wdl.guesses.length + '!'; wdl.msgKind = 'good'; wdlRecord(won); }
  else if (wdl.guesses.length >= 6) { wdl.done = true; wdl.msg = 'the word was ' + wdl.answer.toUpperCase(); wdl.msgKind = 'bad'; wdlRecord(false); }
  wdlSave();
  wdlRender();
  const el = document.getElementById('wdMsg');
  if (el) { el.textContent = wdl.msg || ''; el.className = 'wd-msg ' + (wdl.msgKind || ''); }
}

function wdlNewWord() {
  const answers = wdlData().answers;
  let next = answers[Math.floor(Math.random() * answers.length)];
  let guard = 0;
  while (wdl && next === wdl.answer && guard++ < 20) {
    next = answers[Math.floor(Math.random() * answers.length)];
  }
  try { localStorage.setItem(WDL_MODE_KEY, 'practice'); } catch {}
  wdl = { mode: 'practice', day: wdlDayNum(), answer: next, guesses: [], current: '', done: false, msg: '', msgKind: '' };
  wdlBusy = false;
  wdlRender();
}

function wdlSetMode(mode) {
  try { localStorage.setItem(WDL_MODE_KEY, mode === 'practice' ? 'practice' : 'daily'); } catch {}
  if (mode === 'practice') { wdlNewWord(); return; }
  wdlInit();
}

function wdlLegacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

function wdlShare() {
  if (!wdl || !wdl.guesses.length) { wdlMsg('nothing to share yet', 'bad'); return; }
  const emoji = { correct: '🟩', present: '🟨', absent: '⬛' };
  const won = wdl.guesses[wdl.guesses.length - 1] === wdl.answer;
  const head = 'wordle ' + (wdl.mode === 'daily' ? 'daily' : 'practice') + ' ' +
    wdl.guesses.length + '/6' + (won ? '' : ' X');
  const gridText = wdl.guesses.map(g => wdlScore(g, wdl.answer).map(r => emoji[r]).join('')).join('\n');
  const text = head + '\n\n' + gridText + '\n\ncf-browser';

  const done = ok => wdlMsg(ok ? 'copied to clipboard' : 'copy failed', ok ? 'good' : 'bad');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true), () => done(!!wdlLegacyCopy(text)));
    return;
  }
  done(!!wdlLegacyCopy(text));
}

document.addEventListener('keydown', (e) => {
  const grid = document.getElementById('wdGrid');
  if (!grid || grid.offsetParent === null) return;
  const el = document.activeElement;
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'enter') { e.preventDefault(); wdlKey('enter'); return; }
  if (k === 'backspace') { e.preventDefault(); wdlKey('back'); return; }
  if (/^[a-z]$/.test(k)) { e.preventDefault(); wdlKey(k); }
});

document.addEventListener('click', (e) => {
  const key = e.target && e.target.closest ? e.target.closest('.wd-key') : null;
  if (key) wdlKey(key.dataset.key);
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'wdMode') wdlSetMode(e.target.value);
});


function navigateTo(url) {
  if (!activeTab) newTab(url);
  else loadUrl(activeTab, url);
}

function goBack() {
  if (!activeTab || activeTab.histIdx <= 0) return;
  activeTab.histIdx--;
  const url = activeTab.history[activeTab.histIdx];
  activeTab.url = url;
  loadUrlWithoutHistory(activeTab, url);
}

function goForward() {
  if (!activeTab || activeTab.histIdx >= activeTab.history.length - 1) return;
  activeTab.histIdx++;
  const url = activeTab.history[activeTab.histIdx];
  activeTab.url = url;
  loadUrlWithoutHistory(activeTab, url);
}

function loadUrlWithoutHistory(tab, url) {
  const cfbPage = cfbPageFrom(url);
  if (cfbPage) {
    tab.url = url;
    tab.title = 'cfb::' + cfbPage;
    renderTabs();
    updateAddrBar();
    updateNavButtons();
    updateStarBtn();
    showCfbPage(tab, cfbPage);
    return;
  }
  tab.loading = true;
  tab.title = hostLabel(url);
  renderTabs();
  setStatusText('Loading ' + url + '...');
  loadIntoFrame(tab, url);
  updateAddrBar();
  updateNavButtons();
  updateStarBtn();
}

function reload() {
  if (activeTab && activeTab.url) {
    loadUrl(activeTab, activeTab.url);
  }
}

// Save session before unload
window.addEventListener('beforeunload', () => {
  try {
    const session = tabs.map(t => ({ url: t.url, title: t.title, pinned: t.pinned })).filter(t => t.url);
    localStorage.setItem('cfb_session', JSON.stringify(session));
  } catch {}
});

// Restore session on load
(function restoreSession() {
  try {
    const raw = localStorage.getItem('cfb_session');
    if (!raw) return;
    const session = JSON.parse(raw);
    if (!Array.isArray(session) || !session.length) return;
    // close the default new tab
    if (tabs.length === 1 && !tabs[0].url) { tabs.splice(0, 1); }
    session.forEach(s => {
      if (!s.url) return;
      const id = ++tabCounter;
      const tab = { id, url: s.url, title: s.title || 'Loading...', history: [s.url], histIdx: 0, loading: false, pinned: !!s.pinned, zoom: 1, view: null, frame: null };
      tabs.push(tab);
    });
    if (tabs.length) { activeTab = tabs[0]; renderTabs(); if (activeTab.url) loadUrl(activeTab, activeTab.url); }
  } catch {}
})();
