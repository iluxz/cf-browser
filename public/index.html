<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%237c5cff'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>C</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CF Browser</title>
<style>
  :root {
    --bg: #0d0d14;
    --bg2: #14141f;
    --bg3: #1c1c2e;
    --surface: #1a1a2e;
    --surface2: #23233a;
    --border: #2a2a42;
    --border2: #3a3a5e;
    --text: #e8e8f0;
    --text2: #a0a0b8;
    --text3: #6a6a88;
    --accent: #7c5cff;
    --accent2: #9d85ff;
    --accent-glow: rgba(124, 92, 255, 0.35);
    --danger: #e2685f;
    --success: #56d18a;
    --warn: #f0b429;
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
    font-size: 13px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== TITLEBAR ===== */
  .titlebar {
    height: 38px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--border);
    user-select: none; -webkit-app-region: drag;
  }
  .titlebar .title { font-size: 13px; font-weight: 600; color: var(--text2); letter-spacing: 0.3px; }
  .titlebar .controls { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .titlebar button {
    width: 28px; height: 28px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .titlebar button:hover { background: var(--surface2); color: var(--text); }

  /* ===== TAB BAR ===== */
  .tabbar {
    height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px;
    background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 30px;
    border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
    background: transparent; color: var(--text3); font-size: 12px;
    transition: background var(--transition), color var(--transition);
    position: relative; max-width: 200px;
  }
  .tab:hover { background: var(--surface); color: var(--text2); }
  .tab.active {
    background: var(--surface); color: var(--text); font-weight: 500;
  }
  .tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 8px; right: 8px; height: 2px;
    background: var(--accent); border-radius: 1px;
  }
  .tab .close { opacity: 0; margin-left: 4px; font-size: 14px; line-height: 1; }
  .tab:hover .close, .tab.active .close { opacity: 1; }
  .tab .close:hover { color: var(--danger); }
  .newtab-btn {
    width: 28px; height: 28px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text3); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .newtab-btn:hover { background: var(--surface); color: var(--text); }

  /* ===== TOOLBAR / ADDRESS BAR ===== */
  .toolbar {
    height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
  }
  .nav-btn {
    width: 30px; height: 30px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .nav-btn:hover { background: var(--surface); color: var(--text); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .addrbar {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border2); border-radius: 20px;
    padding: 0 14px; height: 32px; transition: border-color var(--transition), box-shadow var(--transition);
  }
  .addrbar:focus-within {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .addr-input {
    flex: 1; border: none; background: transparent; color: var(--text);
    font-size: 13px; outline: none; font-family: inherit;
  }
  .addr-input::placeholder { color: var(--text3); }
  .go-btn {
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), transform var(--transition);
  }
  .go-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .star-btn, .settings-btn {
    width: 30px; height: 30px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .zoom-btn, .home-btn, .source-close {
    width: 30px; height: 30px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .zoom-btn:hover, .home-btn:hover, .source-close:hover {
    background: var(--surface); color: var(--text);
  }

  /* ===== BOOKMARKS BAR ===== */
  .bookmarks-bar {
    height: 30px; display: flex; align-items: center; gap: 2px; padding: 0 8px;
    background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto;
    scrollbar-width: none;
  }
  .bookmarks-bar::-webkit-scrollbar { display: none; }
  .bookmark-item {
    display: flex; align-items: center; gap: 4px; padding: 2px 8px; height: 22px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; color: var(--text2);
    white-space: nowrap; transition: background var(--transition);
  }
  .bookmark-item:hover { background: var(--surface); color: var(--text); }
  .bm-remove { opacity: 0; margin-left: 2px; font-size: 12px; }
  .bookmark-item:hover .bm-remove { opacity: 1; color: var(--danger); }

  /* ===== CONTENT AREA ===== */
  .content {
    position: relative; background: var(--bg); overflow: hidden;
    height: calc(100vh - 148px);
  }
  .tabview { position: absolute; inset: 0; }
  .tabview[hidden] { display: none; }
  .webview {
    width: 100%; height: 100%; border: none; background: #fff;
  }

  /* ===== LOADING / ERROR ===== */
  .loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: var(--bg); color: var(--text2);
    font-size: 13px; gap: 14px;
  }
  .loading .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-page {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: var(--bg); color: var(--text2);
    text-align: center; padding: 24px; gap: 8px;
  }
  .error-page h2 { color: var(--danger); font-size: 16px; margin: 0; }
  .error-page .url { color: var(--text3); font-size: 12px; word-break: break-all; max-width: 500px; }

  /* ===== NEW TAB ===== */
  .newtab {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; background: var(--bg);
  }
  .newtab h1 { font-size: 36px; font-weight: 700; color: var(--accent); margin: 0; letter-spacing: 1px; }
  .newtab p { color: var(--text3); font-size: 13px; margin: 0; }
  .newtab .shortcuts {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px;
    max-width: 480px; width: 100%; padding: 0 24px;
  }
  .newtab .shortcut {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 18px 12px; border-radius: var(--radius-lg); cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    transition: background var(--transition), border-color var(--transition), transform var(--transition);
  }
  .newtab .shortcut:hover {
    background: var(--surface2); border-color: var(--accent);
    transform: translateY(-2px);
  }
  .newtab .shortcut .icon { font-size: 28px; }
  .newtab .shortcut .label { font-size: 11px; color: var(--text2); font-weight: 500; }

  /* ===== PROXY HINT BAR ===== */
  .proxy-hint {
    position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 45;
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 10px 14px; box-shadow: var(--shadow);
    font-size: 12px; color: var(--text2); max-width: min(680px, 92vw);
    backdrop-filter: blur(8px);
  }
  .proxy-hint button {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 5px 12px; font-size: 11px; cursor: pointer; white-space: nowrap; font-weight: 500;
    transition: background var(--transition);
  }
  .proxy-hint button:hover { background: var(--accent2); }
  .proxy-hint button.ghost { background: transparent; color: var(--text3); border: 1px solid var(--border2); }
  .proxy-hint button.ghost:hover { background: var(--surface2); color: var(--text2); }

  /* ===== INTERNAL cfb:: PAGES ===== */
  .cfb-page {
    height: 100%; overflow: auto; background: var(--bg); color: var(--text);
    padding: 28px 32px; font-size: 13px; box-sizing: border-box;
  }
  .cfb-page h1 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .cfb-page h3 { font-weight: 600; }
  .cfb-page .empty { color: var(--text3); }
  .cfb-page .item {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 12px 4px; border-bottom: 1px solid var(--border);
    transition: background var(--transition);
  }
  .cfb-page .item:hover { background: var(--surface); }
  .cfb-page .item .title { color: var(--text); font-weight: 500; }
  .cfb-page .item .url { color: var(--text3); font-size: 11px; word-break: break-all; }
  .cfb-page .item button {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 5px 12px; font-size: 11px; cursor: pointer; flex: 0 0 auto; font-weight: 500;
    transition: background var(--transition);
  }
  .cfb-page .item button:hover { background: var(--accent2); }
  .cfb-page .about {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 4px; text-align: center;
  }
  .cfb-page .about .logo { font-size: 54px; margin-bottom: 8px; }
  .cfb-page .about h1 { margin: 0; }
  .cfb-page .about p { color: var(--text2); }

  /* ===== WORDLE ===== */
  .wd { display: flex; flex-direction: column; align-items: center; gap: 13px; user-select: none; padding-top: 4px; }
  .wd h1 { margin: 0; letter-spacing: 3px; text-transform: uppercase; font-size: 17px; color: var(--text); }
  .wd-sub { color: var(--text3); font-size: 11px; margin-top: -8px; }
  .wd-grid { display: grid; gap: 6px; }
  .wd-row { display: grid; grid-template-columns: repeat(5, 54px); gap: 6px; }
  .wd-tile {
    height: 54px; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border2); background: var(--bg3); color: var(--text);
    font-size: 25px; font-weight: 700; text-transform: uppercase; border-radius: var(--radius-sm);
    transition: border-color var(--transition);
  }
  .wd-tile.filled { border-color: var(--text3); }
  .wd-tile.correct { background: #3a9b5c; border-color: #3a9b5c; }
  .wd-tile.present { background: #b39321; border-color: #b39321; }
  .wd-tile.absent { background: var(--surface2); border-color: var(--surface2); color: var(--text3); }
  .wd-tile.flip { animation: wdflip .36s ease; }
  @keyframes wdflip { 0% { transform: rotateX(0deg); } 50% { transform: rotateX(88deg); } 100% { transform: rotateX(0deg); } }
  .wd-row.shake { animation: wdshake .4s; }
  @keyframes wdshake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .wd-msg { height: 16px; font-size: 12px; color: var(--text2); text-align: center; }
  .wd-msg.good { color: var(--success); }
  .wd-msg.bad { color: var(--danger); }
  .wd-kb { display: flex; flex-direction: column; gap: 6px; }
  .wd-kbrow { display: flex; gap: 5px; justify-content: center; }
  .wd-key {
    min-width: 31px; height: 38px; padding: 0 7px; border-radius: var(--radius-sm); border: none;
    background: var(--surface2); color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer; text-transform: uppercase; font-family: inherit;
    transition: background var(--transition);
  }
  .wd-key:hover { background: var(--border2); }
  .wd-key.wide { min-width: 52px; font-size: 10px; letter-spacing: .5px; }
  .wd-key.correct { background: #3a9b5c; }
  .wd-key.present { background: #b39321; }
  .wd-key.absent { background: var(--bg3); color: var(--text3); }
  .wd-foot { display: flex; gap: 8px; align-items: center; }
  .wd-foot button, .wd-foot select {
    background: transparent; border: 1px solid var(--border2); color: var(--text2);
    border-radius: var(--radius-sm); padding: 6px 12px; font-size: 11px; cursor: pointer;
    font-family: inherit; transition: border-color var(--transition), color var(--transition);
  }
  .wd-foot button:hover { border-color: var(--accent); color: var(--text); }
  .wd-foot select { background: var(--surface); }
  .wd-stats { font-size: 11px; color: var(--text3); }

  /* ===== MULTIPLAYER BAR ===== */
  .mp-bar {
    height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: var(--bg2); border-top: 1px solid var(--border); font-size: 12px;
  }
  .mp-status { color: var(--text2); font-weight: 500; }
  .mp-peers { display: flex; gap: 4px; }
  .mp-peer {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center;
    justify-content: center;
  }
  .mp-btn {
    background: var(--surface); color: var(--text2); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: 11px; cursor: pointer;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .mp-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }

  /* ===== MULTIPLAYER CHAT ===== */
  .mp-chat {
    position: fixed; bottom: 50px; right: 12px; width: 300px; max-height: 400px;
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg);
    display: none; flex-direction: column; z-index: 50; box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
  }
  .mp-chat.open { display: flex; }
  .mp-chat-header {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 12px; color: var(--text); cursor: move; user-select: none;
  }
  .mp-chat-header .close { cursor: pointer; color: var(--text3); font-size: 16px; }
  .mp-chat-header .close:hover { color: var(--danger); }
  .mp-chat-messages {
    flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; min-height: 120px;
    max-height: 260px;
  }
  .mp-chat-messages::-webkit-scrollbar { width: 4px; }
  .mp-chat-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .mp-chat-msg { margin-bottom: 6px; line-height: 1.4; }
  .mp-chat-msg .name { font-weight: 600; color: var(--accent2); }
  .mp-chat-msg .ts { color: var(--text3); font-size: 10px; margin-right: 4px; }
  .mp-chat-msg.sys { color: var(--text3); font-style: italic; font-size: 11px; }
  .mp-chat-msg.me .name { color: var(--success); }
  .mp-chat-input {
    display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border);
  }
  .mp-chat-input input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); padding: 6px 10px; font-size: 12px; outline: none;
    transition: border-color var(--transition);
  }
  .mp-chat-input input:focus { border-color: var(--accent); }
  .mp-chat-input button {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 6px 12px; font-size: 11px; cursor: pointer; font-weight: 500;
    transition: background var(--transition);
  }
  .mp-chat-input button:hover { background: var(--accent2); }
  .mp-chat-who { color: var(--text3); font-size: 10px; cursor: pointer; }
  .mp-chat-who:hover { color: var(--accent); }
  .mp-chat-badge {
    background: var(--danger); color: #fff; font-size: 9px; font-weight: 700;
    padding: 1px 5px; border-radius: 8px; margin-left: 4px;
  }

  /* ===== LIVE CURSORS ===== */
  .mp-cursor-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .mp-cursor { position: absolute; opacity: 0; transition: opacity .25s ease; will-change: left, top; }
  .mp-cursor.live { opacity: 1; }
  .mp-cursor svg { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.55)); }
  .mp-cursor-label {
    position: absolute; left: 13px; top: 17px; font-size: 10px; font-weight: 700;
    color: #0b0b12; padding: 1px 6px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .mp-click-ring {
    position: absolute; transform: translate(-50%, -50%); width: 14px; height: 14px;
    border-radius: 50%; border: 2px solid #ffd700; box-shadow: 0 0 10px rgba(255,215,0,.7);
    animation: mpClickRipple .65s ease-out forwards;
  }
  @keyframes mpClickRipple {
    0% { transform: translate(-50%,-50%) scale(0.6); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(3.2); opacity: 0; }
  }

  /* ===== SCREEN SHARE VIEW ===== */
  #mpShareView video { background: #000; }

  /* ===== MULTIPLAYER OVERLAY ===== */
  .mp-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .mp-panel {
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg);
    padding: 24px; width: 360px; max-width: 90vw; text-align: center;
    box-shadow: var(--shadow);
  }
  .mp-panel-wide { width: 420px; }
  .mp-panel h2 { color: var(--accent); margin-bottom: 12px; font-size: 18px; }
  .mp-panel p { color: var(--text2); font-size: 12px; margin-bottom: 12px; }
  .mp-panel input {
    width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text); font-size: 13px; margin-bottom: 12px; outline: none;
    transition: border-color var(--transition);
  }
  .mp-panel input:focus { border-color: var(--accent); }
  .mp-panel button {
    padding: 8px 16px; border-radius: var(--radius-sm); border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; margin: 4px; font-weight: 500;
    transition: background var(--transition);
  }
  .mp-panel button:hover { background: var(--accent2); }
  .mp-panel button.secondary { background: var(--surface2); color: var(--text2); }
  .mp-panel button.secondary:hover { background: var(--border2); color: var(--text); }
  .mp-panel .code-display {
    font-size: 24px; font-weight: 800; color: var(--warn); letter-spacing: 4px; margin: 12px 0;
  }
  .mp-fields { display: flex; gap: 12px; margin-bottom: 8px; }
  .mp-fields label { flex: 1; text-align: left; font-size: 11px; color: var(--text3); }
  .mp-fields input { margin-bottom: 0; }
  .mp-toggles { display: flex; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
  .mp-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); cursor: pointer; }
  .mp-check input { width: auto; margin: 0; }
  .mp-hint { color: var(--text3); font-size: 11px; margin-top: 8px; }
  .mp-err { color: var(--danger); font-size: 12px; margin-bottom: 12px; }
  .mp-panel select {
    width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text); font-size: 13px; margin-bottom: 12px; outline: none;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* ===== FIND BAR ===== */
  .find-bar {
    position: fixed; top: 80px; right: 12px; z-index: 40;
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 6px 8px; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
  }
  .find-bar input {
    width: 180px; height: 26px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text); padding: 0 10px; font-size: 12px; outline: none;
  }
  .find-bar input:focus { border-color: var(--accent); }
  .find-bar button {
    padding: 4px 8px; border-radius: var(--radius-sm); border: none;
    background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 11px;
    transition: background var(--transition);
  }
  .find-bar button:hover { background: var(--border2); color: var(--text); }
  .find-count { font-size: 11px; color: var(--text3); min-width: 40px; text-align: center; }
  .zoom-controls { display: flex; align-items: center; gap: 4px; }
  .zoom-level { font-size: 11px; color: var(--text3); min-width: 36px; text-align: center; }

  /* ===== THEMES ===== */
  body.theme-light { background: #f0f0f5; color: #1a1a2e; }
  body.theme-light .titlebar, body.theme-light .tabbar, body.theme-light .mp-bar, body.theme-light .statusbar, body.theme-light .bookmarks-bar { background: #e8e8f0; color: #1a1a2e; border-color: #d0d0e0; }
  body.theme-light .content { background: #fff; }
  body.theme-light .tab { color: #555; }
  body.theme-light .tab.active { background: #fff; }
  body.theme-light .addr-bar, body.theme-light .mp-chat { background: #fff; border-color: #d0d0e0; }
  body.theme-light .addr-input { color: #1a1a2e; }
  body.theme-light .newtab h1 { color: var(--accent); }
  body.theme-light .cfb-page { background: #f5f5fa; color: #1a1a2e; }
  body.theme-light .cfb-page .item .title { color: #1a1a2e; }
  body.theme-light .cfb-page .item .url { color: #666; }
  body.theme-light .wd-tile { background: #e8e8f0; border-color: #ccc; color: #1a1a2e; }
  body.theme-light .wd-key { background: #d8d8e8; color: #1a1a2e; }
  body.theme-light .mp-chat-messages { color: #1a1a2e; }
  body.theme-light .mp-chat-input input { background: #f0f0f5; color: #1a1a2e; border-color: #d0d0e0; }
  body.theme-midnight { --accent: #00d4ff; --accent2: #33ddff; --accent-glow: rgba(0,212,255,0.35); }
  body.theme-midnight .go-btn, body.theme-midnight .mp-btn, body.theme-midnight .cfb-page .item button { background: #00d4ff; color: #000; }
  body.theme-midnight .tab.active::after { background: #00d4ff; }
  body.theme-midnight .newtab h1, body.theme-midnight .cfb-page h1 { color: #00d4ff; }
  body.theme-midnight .wd-tile.correct, body.theme-midnight .wd-key.correct { background: #00d4ff; color: #000; }
  body.theme-forest { --accent: #4ade80; --accent2: #6ee7a0; --accent-glow: rgba(74,222,128,0.35); }
  body.theme-forest .go-btn, body.theme-forest .mp-btn, body.theme-forest .cfb-page .item button { background: #4ade80; color: #000; }
  body.theme-forest .tab.active::after { background: #4ade80; }
  body.theme-forest .newtab h1, body.theme-forest .cfb-page h1 { color: #4ade80; }
  body.theme-forest .wd-tile.correct, body.theme-forest .wd-key.correct { background: #4ade80; color: #000; }
  body.theme-sunset { --accent: #fb923c; --accent2: #fdba74; --accent-glow: rgba(251,146,60,0.35); }
  body.theme-sunset .go-btn, body.theme-sunset .mp-btn, body.theme-sunset .cfb-page .item button { background: #fb923c; color: #000; }
  body.theme-sunset .tab.active::after { background: #fb923c; }
  body.theme-sunset .newtab h1, body.theme-sunset .cfb-page h1 { color: #fb923c; }
  body.theme-sunset .wd-tile.correct, body.theme-sunset .wd-key.correct { background: #fb923c; color: #000; }
</style>
</head>
<body>

<div class="titlebar">CF Browser — Powered by Cloudflare Pages</div>

<div class="tabbar" id="tabbar">
  <button class="newtab-btn" onclick="newTab()">+</button>
</div>

<div class="addrbar">
  <button class="nav-btn" id="backBtn" onclick="goBack()" disabled>←</button>
  <button class="nav-btn" id="fwdBtn" onclick="goForward()" disabled>→</button>
  <button class="nav-btn" onclick="reload()">↻</button>
  <input class="addr-input" id="addrInput" placeholder="Enter URL or search..." onkeydown="if(event.key==='Enter')navigate()">
  <button class="go-btn" onclick="navigate()">→</button>
  <button class="home-btn" onclick="goHome()" title="Home">H</button>
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomOut()" title="Zoom out">-</button>
    <span class="zoom-level" id="zoomLevel">100%</span>
    <button class="zoom-btn" onclick="zoomIn()" title="Zoom in">+</button>
  </div>
  <button class="star-btn" id="starBtn" onclick="toggleBookmark()" title="Bookmark">☆</button>
  <button class="settings-btn" onclick="openSettings()" title="Settings">S</button>
  <button class="settings-btn" onclick="viewSource()" title="View source">&lt;/&gt;</button>
</div>

<div class="bookmarks-bar" id="bookmarksBar"></div>

<div class="mp-bar" id="mpBar">
  <span class="mp-status" id="mpStatus">Not connected</span>
  <div class="mp-peers" id="mpPeers"></div>
  <button class="mp-btn" onclick="mpHost()">Host Room</button>
  <button class="mp-btn" onclick="mpJoin()">Join Room</button>
  <button class="mp-btn" id="mpChatBtn" onclick="mpToggleChat()" style="display:none">Chat</button>
  <button class="mp-btn" id="mpFollowBtn" onclick="mpToggleFollow()" style="display:none">Follow: on</button>
  <button class="mp-btn" id="mpCursorsBtn" onclick="mpToggleCursors()" style="display:none">Cursors: on</button>
  <button class="mp-btn" id="mpShareBtn" onclick="mpToggleShare()" style="display:none">Share screen</button>
  <button class="mp-btn" id="mpLeaveBtn" onclick="mpLeave()" style="display:none">Leave</button>
</div>
<div class="mp-chat" id="mpChat">
  <div class="mp-chat-header">
    <span>Room Chat</span>
    <span class="mp-chat-who" id="mpChatWho" onclick="mpRename()" title="click to change your name">you</span>
    <span class="close" onclick="mpToggleChat()">×</span>
  </div>
  <div class="mp-chat-messages" id="mpChatMessages"></div>
  <div class="mp-chat-input">
    <input type="text" id="mpChatInput" placeholder="Message the room..." maxlength="500" onkeydown="mpChatKey(event)">
    <button onclick="mpSendChat()">Send</button>
  </div>
</div>
<div class="content" id="content"></div>
<div id="mpShareView" style="display:none;position:fixed;inset:0;z-index:70;background:#000;">
  <video id="mpShareVideo" autoplay playsinline style="width:100%;height:100%;object-fit:contain;"></video>
  <button onclick="mpStopViewing()" style="position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;border:1px solid #555;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;">close</button>
  <div id="mpShareLabel" style="position:absolute;bottom:12px;left:12px;color:#fff;font-size:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;"></div>
</div>
<div id="findBarContainer"></div>

<div class="statusbar" id="statusbar">Ready</div>

<script src="wordle-words.js"></script>
<script src="engine.js"></script>
<script src="apps.js"></script>
<script src="multiplayer.js"></script>
<script src="init.js"></script>
</body>
</html>
